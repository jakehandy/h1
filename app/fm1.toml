# h1's build settings for fm1-base's tools/build.py (../build.sh runs it; the keys are explained at its top)
name = "h1"                    # names the build's files: app/build/h1.fwsc, h1-X.Y.Z.fwsc
id_prefix = "FM-1_481"         # h1's own package identity: dev builds FM-1_48100, releases FM-1_481XXYYZZ
usb_manufacturer = "h1"
usb_product = "h1 FM-1"
# the core is the DSP and the drawing: separate units at -O2
o2 = ["../core/*.c"]
o2_cflags = ["-DH1_DEVICE=1"]
words = "words.tsv"
# one SRAM budget for RAM code, .data/.bss and the pool (base/device/app_packed.ld): h1's pool is big (the
# framebuffer and its copy, the echo, the reverb, the string lines) and its .data/.bss small
ram_layout = "packed"
# app/hw/panel.h asks the panel's SPI whether a transfer is done (the BSP can only wait for it): the one
# place h1 reads a register, kept apart so the build's register check holds for the rest of the app
vendored = ["hw/"]
# The second core takes every other voice (app.c). Some FM-1s misread memory on the second core; with the
# fallback, one that does goes on with one core until it is switched off, instead of restarting.
# FM1B_CPU2=0 ./build.sh makes the build without the second core (CI keeps both).
cpu2 = true
cpu2_fallback = true
# Bluetooth MIDI with a computer or a phone, on fm1-base's own stack (Optimist's, MPL-2.0: nothing of JieLi's
# linked, about 41-46 KB of flash and 10 KB of RAM). In and out, as USB's. Without pairing: macOS and iOS connect
# anyway. Its diagnostics left out for the room. ./build.sh --no-ble: h1-usb.fwsc, without it.
ble = true
ble_stack = "own"
ble_diag = false
# fm1-base's own fonts are only for its update, crash and safe-mode screens (h1 draws its own stroke font): kept as
# their lit boxes and Huffman-coded, the same pixels in about a third of the flash, which Bluetooth needs
font_trim = true
font_pack = true
# what a crash leaves behind is kept in flash (read with base/tools/fm1_remote.py crashes), with each stack's
# room at the crash; the stacks are painted at every start, so their unused bytes can be read (app.c's PERF)
crash_history = true
# USB audio: the FM-1 is a USB audio input beside its USB MIDI (one composite device), so a computer or a phone
# records it straight off the cable: the sound at MASTER. Nothing played back through it (usb_audio_out).
usb_audio_in = true
usb_audio_out = false
# firmware.json, for firmware hubs (base/docs/FIRMWARE-JSON.md): the build writes it from these
tagline = "Fourteen animated instruments for the FM-1"
repo = "https://github.com/jakehandy/h1"
licence = "MIT"
credits = "h1 is built on fm1-base by Charles Vestal and felucca-bsp, which come from Felucca by Leo Kuroshita, Hügelton Instruments."
author = "Jake Handy"
description = "Fourteen instruments, each a full-screen animated picture you play. PRESETS changes the instrument, ALGORITHM changes its character, and the four knobs always shape the sound and the picture together. With a loop recorder, a step sequencer, an arpeggiator and a metronome."
tags = ["synth", "sequencer", "experimental"]
install = "https://github.com/jakehandy/h1#install"
site = "https://jakehandy.com/h1"
screenshot = "docs/img/cozy.png"
