# h1's build settings for fm1-base's tools/build.py (../build.sh runs it; the keys are explained at its top)
name = "h1"                    # names the build's files: app/build/h1.fwsc, h1-X.Y.Z.fwsc
id_prefix = "FM-1_481"         # h1's own package identity: dev builds FM-1_48100, releases FM-1_481XXYYZZ
usb_manufacturer = "h1"
usb_product = "h1 FM-1"
# the core is the DSP and the drawing: separate units at -O2
o2 = ["../core/*.c"]
o2_cflags = ["-DH1_DEVICE=1"]
words = "words.tsv"
# one SRAM budget for RAM code, .data/.bss and the pool (base/device/app_packed.ld): h1's pool is big (the
# framebuffer and its copy, the echo, the reverb, the string lines) and its .data/.bss small
ram_layout = "packed"
# app/hw/panel.h asks the panel's SPI whether a transfer is done (the BSP can only wait for it): the one
# place h1 reads a register, kept apart so the build's register check holds for the rest of the app
vendored = ["hw/"]
# The second core takes every other voice (app.c). Some FM-1s misread memory on the second core; with the
# fallback, one that does goes on with one core until it is switched off, instead of restarting.
# FM1B_CPU2=0 ./build.sh makes the build without the second core (CI keeps both).
cpu2 = true
cpu2_fallback = true
ble = false
# OCT- and OCT+ held: the USB port as a host for a USB-MIDI keyboard or synth (powered hub or adapter: the FM-1 gives
# the port no power). Boot is always a device, so a computer can always reach it after a restart.
usb_host = true
# fm1-base's own fonts only draw its update, crash and safe-mode screens (h1 draws with its own stroke font):
# stored trimmed to each glyph's lit box and Huffman-coded, the same pixels in about 17.5 KB instead of 61 KB
font_trim = true
font_pack = true
# what a crash leaves behind is kept in flash (read with base/tools/fm1_remote.py crashes), with each stack's
# room at the crash; the stacks are painted at every start, so their unused bytes can be read (app.c's PERF)
crash_history = true
# USB audio: the FM-1 is a USB audio input beside its USB MIDI (one composite device), so a computer or a phone
# records it straight off the cable: the sound at MASTER. Nothing played back through it (usb_audio_out).
usb_audio_in = true
usb_audio_out = false
# stems: the USB audio input has ten channels, the master on 1 and 2 and four stereo stems after it (core/h1.h
# h1_stems): 3-4, 5-6 and 7-8 the instruments of the recorded layers in the layer view's order, then the one in hand;
# 9-10 the rest. 44.1 kHz only, and the ring takes 20 bytes a frame (10 KB instead of 2)
usb_audio_channels = 10
# a USB serial number from the chip's ID: a computer tells this FM-1 apart by it, not by the port it is in (macOS
# otherwise keeps what it learnt of another firmware on that port: 0.3.1, for a computer that did not see h1's audio)
usb_serial = true
# The M-VAVE panel's own ST7789V settings after the reset (porch, gate voltages, VCOM, supplies, 60 Hz, gammas):
# newer FM-1s (the FM-1/M-VAVE logo under the screen) show washed-out colours, no reds or a blank screen without
# them. app.c then sends M-VAVE's own sequence once more, in its order, and slows the panel's clock on those units.
lcd_panel = true
# firmware.json, for firmware hubs (base/docs/FIRMWARE-JSON.md): the build writes it from these
# the name people see on a listing; name above stays "h1" (file names, id, USB names)
title = "handy-1 (h1)"
tagline = "Sixteen animated instruments for the FM-1"
repo = "https://github.com/jakehandy/h1"
licence = "MIT"
credits = "h1 is built on fm1-base by Charles Vestal and felucca-bsp, which come from Felucca by Leo Kuroshita, Hügelton Instruments."
author = "Jake Handy"
description = "Sixteen instruments, each a full-screen animated picture you play. PRESETS changes the instrument, ALGORITHM changes its character, and the four knobs always shape the sound and the picture together. With a loop recorder, a step sequencer, an arpeggiator and a metronome."
tags = ["synth", "sequencer", "experimental"]
install = "https://github.com/jakehandy/h1#install"
site = "https://jakehandy.com/h1"
screenshot = "docs/img/cozy.png"
